name: Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run server tests
        env:
          LC_ALL: C.UTF-8
        run: ./server-tests/run.sh

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_DIR=/tmp/android-sdk
          mkdir -p "$SDK_DIR"
          cd /tmp
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qo cmdline-tools.zip -d "$SDK_DIR/"
          mkdir -p "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools-latest" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;34.0.0" >/dev/null 2>&1
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build debug APK
        env:
          ANDROID_HOME: /tmp/android-sdk
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  browser-tests:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install Android SDK
        run: |
          SDK_DIR=/tmp/android-sdk
          mkdir -p "$SDK_DIR"
          cd /tmp
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qo cmdline-tools.zip -d "$SDK_DIR/"
          mkdir -p "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools-latest" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;34.0.0" >/dev/null 2>&1
      - name: Build debug APK
        env:
          ANDROID_HOME: /tmp/android-sdk
        run: ./gradlew --no-daemon assembleDebug
      - name: Install Playwright
        uses: microsoft/playwright-github-action@v1
      - name: Run browser tests
        run: npx playwright test
        env:
          LC_ALL: C.UTF-8

  release:
    name: Signed release APK + GitHub Release
    runs-on: ubuntu-latest
    needs: [build, browser-tests]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_DIR=/tmp/android-sdk
          mkdir -p "$SDK_DIR"
          cd /tmp
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qo cmdline-tools.zip -d "$SDK_DIR/"
          mkdir -p "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools-latest" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;34.0.0" >/dev/null 2>&1
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Restore keystore
        run: |
          echo "${{ secrets.PB_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pocketbridge.jks"
      - name: Build signed release APK
        env:
          PB_KEYSTORE: ${{ runner.temp }}/pocketbridge.jks
          PB_KEYSTORE_PASSWORD: ${{ secrets.PB_KEYSTORE_PASSWORD }}
          ANDROID_HOME: /tmp/android-sdk
        run: ./gradlew --no-daemon assembleRelease
      - name: Get release version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_code=$(grep -oP 'versionCode \K\d+' app/build.gradle)" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBridge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
