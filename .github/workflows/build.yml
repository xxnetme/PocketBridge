name: Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer tag must not publish while another run is still checking the update baseline.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'pocketbridge-stable-release' || format('pocketbridge-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  server-tests:
    name: Server tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test release verification rules
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Run server & WebDAV tests
        env:
          LC_ALL: C.UTF-8
        run: ./server-tests/run.sh

  browser-tests:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test dependencies (Pillow, python-docx, Playwright Chromium)
        run: |
          python3 -m venv "$RUNNER_TEMP/pyvenv"
          "$RUNNER_TEMP/pyvenv/bin/pip" install --quiet pillow python-docx
          echo "$RUNNER_TEMP/pyvenv/bin" >> "$GITHUB_PATH"

          mkdir -p "$RUNNER_TEMP/pw"
          npm --prefix "$RUNNER_TEMP/pw" init -y >/dev/null
          npm --prefix "$RUNNER_TEMP/pw" install --no-save playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run Playwright UI tests against live HTTPS FileServer
        env:
          LC_ALL: C.UTF-8
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PB_WORK: ${{ runner.temp }}/ui
          PB_BASE: https://127.0.0.1:8765
          PB_RO_BASE: https://127.0.0.1:8766
          PB_KEY: deadbeefcafe1234
        run: |
          mkdir -p "$PB_WORK/root"
          python3 server-tests/make-ui-tree.py "$PB_WORK/root"
          cp -a "$PB_WORK/root" "$PB_WORK/read-only"

          ./server-tests/run.sh --serve "$PB_WORK/root" "$PB_KEY" tls --read-only "$PB_WORK/read-only" > "$PB_WORK/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'pkill -P "$SERVER_PID" 2>/dev/null || true; kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if grep -q '^READY$' "$PB_WORK/server.log" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          if ! grep -q '^READY$' "$PB_WORK/server.log"; then
            echo "::error::Demo server failed to start"
            cat "$PB_WORK/server.log"
            exit 1
          fi

          node server-tests/ui-test.js
          node server-tests/features-ui-test.js
      - name: Upload UI screenshots & diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PocketBridge-ui-diagnostics
          path: |
            ${{ runner.temp }}/ui/server.log
            ${{ runner.temp }}/ui/ui-results.json
            ${{ runner.temp }}/ui/shots/*.png
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle & Robolectric
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - uses: ./.github/actions/setup-android
      - name: Read app version
        id: meta
        run: |
          VER=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Lint, Android lifecycle tests (Robolectric) & build debug APK
        run: |
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 5
          mkdir -p "$RUNNER_TEMP/debug-out"
          cp "$APK" "$RUNNER_TEMP/debug-out/PocketBridge-v${{ steps.meta.outputs.version }}-debug.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: PocketBridge-debug-apk
          path: ${{ runner.temp }}/debug-out/*.apk
          if-no-files-found: error
          retention-days: 14

  upgrade-smoke:
    name: Verify Android upgrade without reinstall (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-android
      - name: Build previous and candidate APKs with a disposable key
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          BASE=$(git describe --tags --match 'v[0-9]*' --exclude "v$VERSION" --abbrev=0 HEAD)
          tools/build-upgrade-pair.sh "$BASE" "$RUNNER_TEMP/upgrade-apks"
      - name: Verify a preserved preference on a clean emulator
        env:
          SMOKE_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then echo 'Android upgrade smoke requires a KVM-enabled runner' >&2; exit 1; fi
          sudo chmod a+rw /dev/kvm
          SDK_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          IMAGE="system-images;android-${SMOKE_API};google_apis;x86_64"
          "$SDK_TOOLS/sdkmanager" 'emulator' "$IMAGE" >/dev/null
          echo no | "$SDK_TOOLS/avdmanager" create avd --name pb-upgrade --package "$IMAGE" --force
          "$ANDROID_HOME/emulator/emulator" -avd pb-upgrade -port 5554 -accel on \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/pb-emulator.log" 2>&1 &
          PID=$!
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || true; kill "$PID" 2>/dev/null || true' EXIT
          if ! timeout 300 bash -c 'adb -s emulator-5554 wait-for-device; until [[ $(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done'; then
            tail -60 "$RUNNER_TEMP/pb-emulator.log"
            exit 1
          fi
          adb -s emulator-5554 shell input keyevent 224
          adb -s emulator-5554 shell wm dismiss-keyguard
          python3 tools/verify-update.py --serial emulator-5554 \
            "$RUNNER_TEMP/upgrade-apks/previous.apk" "$RUNNER_TEMP/upgrade-apks/candidate.apk"

  sign-release:
    name: Build and verify the permanently signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, browser-tests, upgrade-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag from main and a pinned certificate
        env:
          PB_SIGNER_SHA256: ${{ vars.PB_SIGNER_SHA256 }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 tools/release.py metadata "$GITHUB_REF_NAME" --check-pin
      - name: Fetch the previous published stable APK, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py baseline "$GITHUB_REF_NAME" "$RUNNER_TEMP/previous-stable.apk"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-android
      - name: Build with the owner's key and verify identity and version
        env:
          PB_KEYSTORE_BASE64: ${{ secrets.PB_KEYSTORE_BASE64 }}
          PB_KEYSTORE_PASSWORD: ${{ secrets.PB_KEYSTORE_PASSWORD }}
          PB_KEY_ALIAS: ${{ secrets.PB_KEY_ALIAS }}
          PB_KEY_PASSWORD: ${{ secrets.PB_KEY_PASSWORD }}
          PB_SIGNER_SHA256: ${{ vars.PB_SIGNER_SHA256 }}
        run: |
          args=()
          if [[ -f "$RUNNER_TEMP/previous-stable.apk" ]]; then args+=("$RUNNER_TEMP/previous-stable.apk"); fi
          tools/sign-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets" "${args[@]}"
      - name: Upload only verified signed assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PocketBridge-release
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the verified GitHub Release
    runs-on: ubuntu-latest
    needs: sign-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: PocketBridge-release
          path: release-assets
      - name: Publish signed assets without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$existing"; then
            echo 'A release or draft already exists for this tag; no assets were replaced.' >&2
            exit 1
          fi
          cd release-assets
          artifacts=("PocketBridge-$GITHUB_REF_NAME.apk" "PocketBridge-$GITHUB_REF_NAME.aab" APK-SIGNER-SHA256.txt SHA256SUMS.txt)
          for file in "${artifacts[@]}"; do test -s "$file"; done
          sha256sum --strict --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "PocketBridge $GITHUB_REF_NAME" --generate-notes \
            --notes 'Стабильные APK с тем же сертификатом обновляются без переустановки. Старые debug-APK могут быть подписаны другим ключом и не обновляются поверх.'
