<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
<title id="title">PocketBridge</title>
<desc id="description">Файлы телефона в браузере компьютера через локальную сеть Wi-Fi.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10272c"/><stop offset="1" stop-color="#091419"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#72e4bc" stop-opacity=".19"/><stop offset="1" stop-color="#72e4bc" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="390" rx="32" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="388" rx="31" fill="none" stroke="#29494a" stroke-width="2"/>
<circle cx="930" cy="190" r="225" fill="url(#glow)"/>
