  <circle cx="84" cy="72" r="4" fill="#83e5c2"/><text x="99" y="77" font-size="12" font-weight="700" letter-spacing="1.5" fill="#a2e8cf">ANDROID  /  WI-FI</text>
  <text x="62" y="179" font-size="72" font-weight="750" letter-spacing="-3" fill="#f0faf5">Pocket<tspan fill="#83e5c2">Bridge</tspan></text>
  <text x="67" y="224" font-size="22" fill="#b5d0c9">Файлы телефона — в браузере компьютера.</text>
  <text x="67" y="259" font-size="17" fill="#789c96">Без проводов. В вашей локальной сети.</text>
  <rect x="66" y="299" width="145" height="34" rx="17" fill="#182f31" stroke="#294b46"/><text x="83" y="321" font-size="13" fill="#c5e5d9">Android 8.0+</text>
  <rect x="221" y="299" width="151" height="34" rx="17" fill="#182f31" stroke="#294b46"/><text x="238" y="321" font-size="13" fill="#c5e5d9">Любой браузер</text>
</g>
